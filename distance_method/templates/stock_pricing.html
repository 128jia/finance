<!DOCTYPE html>
{% extends "templates.html" %} 
{% block title %} Stock Pricing {% endblock %}
{% block content %}
{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

        <!-- Custom JS -->
        <script type="text/javascript" src="{% static 'js/distance.js' %}"></script>
        
       



        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.6.1/d3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.1/dist/jquery.min.js"></script>

        <!-- DataTables -->
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css">
        <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"></script>
         <!-- highcharts -->
        <script src="https://code.highcharts.com/stock/highstock.js"></script>
        <script src="https://code.highcharts.com/stock/modules/data.js"></script>
        <script src="https://code.highcharts.com/stock/modules/drag-panes.js"></script>
        <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
        <script src="https://code.highcharts.com/stock/modules/accessibility.js"></script>
        <script src="https://code.highcharts.com/stock/modules/export-data.js"></script>
        <!-- sweetalert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        {% csrf_token %}
        <script>
            csrf_token= "{{ csrf_token }}"
        </script>

    </head>
    
    <div class="container"> 
        <div class="card mt-3"> <!-- 控制卡片的最大宽度 -->
            <div class="card-header fs-5 fw-bold">
                Stock Pricing
            </div>
            <div class='card-body'>
                <form id="ajax_form">
                    {% csrf_token %}
                    <!-- 股票代號和策略選擇 -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-4">
                                <label for="ticker" class="form-label">輸入股票代號:</label>
                                <input type="text" class="form-control" id="ticker" name="ticker" value="1303">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="mb-4">
                                <label for="years" class="form-label">歷史幾年資料:</label>
                                <select id="years" name="years" class="form-select">
                                    <option value="5">5</option>
                                    <option value="10" selected>10</option>
                                    <option value="20">20</option>
                                    <option value="30">30</option>
                                </select>
                            </div>
                        </div>
                    </div>
                <button class="btn btn-secondary mt-3" id="search" style="background-color: #85c1e9; color: #ffffff; border: none; font-weight: bold;">Search</button>
                <hr>
                <h3>即時股價: <span id="current-price"></span></h3>
                <p3 style="font-size: medium; color: gray; margin-left: 20px;">
                更新時間: <span id="current-date"></span> <span id="current-time"></span>
                </p3>
                <hr>
                <div id="highcharts-container" style="width: 100%; height: 500px;"></div>
                <div id="table_container" style="width: 100%; height: 500px;"></div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/stock_pricing.js' %}"></script> 
 

</html>
{% endblock %}
<!-- final -->
