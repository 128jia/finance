<!-- base.html -->
<!DOCTYPE html>
{% load static %}
<html>
    <head>
        {% csrf_token %}
        <script type="text/javascript">
            // 提供 CSRF 令牌给 JavaScript
            window.CSRF_TOKEN = '{{ csrf_token }}';
        </script>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS & JS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <!-- jQuery -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">       
        
        <!-- DataTables CSS -->
        <link href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css" rel="stylesheet">       
        
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
        <!-- DataTables JS -->
        <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- sweetalert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <!-- Load d3.js -->
        <script src="https://d3js.org/d3.v6.js"></script>
        
        <!-- 引入Tippy.js的CSS -->
        <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css">
        <!-- 引入Tippy.js -->
        <script src="https://unpkg.com/@popperjs/core@2"></script>
        <script src="https://unpkg.com/tippy.js@6"></script>
        
        


        <!-- highcharts -->
        <script src="https://code.highcharts.com/stock/highstock.js"></script>
        <script src="https://code.highcharts.com/stock/modules/data.js"></script>
        <script src="https://code.highcharts.com/stock/modules/drag-panes.js"></script>
        <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
        <script src="https://code.highcharts.com/stock/modules/accessibility.js"></script>
        <script src="https://code.highcharts.com/stock/modules/export-data.js"></script>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- jQuery日期用 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

        <!-- sweetalert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!-- Load d3.js -->
        <script src="https://d3js.org/d3.v6.js"></script>

        <!-- 引入Tippy.js的CSS -->
        <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css">
        <!-- 引入Tippy.js -->
        <script src="https://unpkg.com/@popperjs/core@2"></script>
        <script src="https://unpkg.com/tippy.js@6"></script>

        <!-- DataTables -->
        <link href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css" rel="stylesheet"> 
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css">
        <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"></script>


        {% comment %} <script type="text/javascript" src="{% static 'js/monitor1.js' %}"></script> {% endcomment %}
        <script type="text/javascript" src="{% static 'js/index1.js' %}"></script>


        <title>
        {% block title %} {% endblock %}
        </title>



    </head>
    <body>
        <!-- header -->
        <header class="py-3 mb-5 text-center bg-dark shadow">
            <h2 class="text-light">Financial Analysis</div>
             <!-- tracker -->
            <div class="dropdown position-absolute" style="top: 20px; right: 130px;">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="toolDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Tool
                </button>
                <!-- 要改 -->
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="toolDropdown">
                    <li><a class="dropdown-item" href="http://127.0.0.1:1985/monitor1/">Track list</a></li>
                    <li><a class="dropdown-item" href="http://127.0.0.1:1985/web_tool">Strategy</a></li>
                </ul>
            </div>
            <!-- Account Dropdown Menu aligned to the right -->
            <div class="dropdown position-absolute" style="top: 20px; right: 20px;">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="accountDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Account
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
                    <li><a class="dropdown-item" href="http://127.0.0.1:1984/account/logout">Log Out</a></li>
                </ul>
            </div>
        </header>
        
        <!-- content -->
        {% block content %} {% endblock %}

        <!-- footer -->
        <footer class="py-4 mt-5 text-center text-muted bg-light border-top">
             &copy; 2025
        </footer>
    </body>
</html>
